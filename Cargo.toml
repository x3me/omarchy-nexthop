[package]
name = "nexthop"
version = "0.2.71-r"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
